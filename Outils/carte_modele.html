<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcours Lean — carte</title>
<style>
:root {
  --fond: #f6f5f1; --panneau: #ffffff; --texte: #22211f; --doux: #6b6862; --ligne: #dcd9d1;
  --bande: rgba(0,0,0,0.025);
  --pur: #c99a06; --pur-fond: #fff6d6;
  --ok: #2f8f4e; --ok-fond: #e3f4e8;
  --dispo: #2f6fd6; --dispo-fond: #e6efff;
  --verrou: #a9a69e; --verrou-fond: #efede8;
  --err: #c93a3a; --err-fond: #fde8e8;
  --cours: #7a55c7; --cours-fond: #efe8fb;
  --arete: #c4c0b6; --accent: #e0651b;
  --code-fond: #f0eee8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fond: #16171a; --panneau: #1f2024; --texte: #e8e6e1; --doux: #9a978f; --ligne: #34353b;
    --bande: rgba(255,255,255,0.025);
    --pur: #f2c230; --pur-fond: #3a3117;
    --ok: #5cc27e; --ok-fond: #1c3224;
    --dispo: #6b9fff; --dispo-fond: #1c2a45;
    --verrou: #6d6b66; --verrou-fond: #26272b;
    --err: #ff6b6b; --err-fond: #3d1f1f;
    --cours: #b294f0; --cours-fond: #2c2440;
    --arete: #44464d; --accent: #ff8a3d;
    --code-fond: #2a2b30;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
#app { display: grid; grid-template-columns: 1fr 420px; height: 100vh; }
#carte { position: relative; overflow: hidden; cursor: grab; }
#carte.glisse { cursor: grabbing; }
#carte svg { width: 100%; height: 100%; display: block; user-select: none; }
#cote { border-left: 1px solid var(--ligne); background: var(--panneau); overflow-y: auto; padding: 18px 20px 40px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sous { color: var(--doux); font-size: 13px; }
.barre { height: 10px; border-radius: 6px; background: var(--verrou-fond); overflow: hidden; margin: 10px 0 4px; display: flex; }
.barre i { display: block; height: 100%; }
.filtres { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.filtres button, .bouton { border: 1px solid var(--ligne); background: var(--panneau); color: var(--texte);
  border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.filtres button.actif { background: var(--texte); color: var(--panneau); border-color: var(--texte); }
.bouton:hover, .filtres button:hover { border-color: var(--doux); }
input[type=search] { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--ligne);
  background: var(--fond); color: var(--texte); font-size: 14px; }
.liste { list-style: none; padding: 0; margin: 8px 0; }
.liste li { padding: 7px 9px; border-radius: 8px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.liste li:hover { background: var(--fond); }
.liste .id { color: var(--doux); font-size: 12px; margin-left: auto; white-space: nowrap; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--doux); margin: 22px 0 6px; }
.etoiles { color: var(--pur); letter-spacing: 1px; }
.badge { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
.b-pur { background: var(--pur-fond); color: var(--pur); }
.b-reussi { background: var(--ok-fond); color: var(--ok); }
.b-dispo { background: var(--dispo-fond); color: var(--dispo); }
.b-verrou { background: var(--verrou-fond); color: var(--doux); }
.b-erreur, .b-modifie { background: var(--err-fond); color: var(--err); }
.b-cours { background: var(--cours-fond); color: var(--cours); }
.md h1 { font-size: 19px; margin: 10px 0 8px; }
.md h2 { font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--texte); margin: 18px 0 6px; }
.md h3 { font-size: 14px; margin: 14px 0 4px; }
.md p { margin: 8px 0; }
.md code { background: var(--code-fond); padding: 1px 5px; border-radius: 4px; font: 13px/1.4 "SF Mono", Menlo, Consolas, monospace; }
.md pre, pre.code { background: var(--code-fond); padding: 10px 12px; border-radius: 8px; overflow-x: auto;
  font: 12.5px/1.5 "SF Mono", Menlo, Consolas, monospace; white-space: pre; }
.md pre code { background: none; padding: 0; }
.md ul, .md ol { padding-left: 22px; margin: 6px 0; }
.md a { color: var(--dispo); }
.md hr { border: none; border-top: 1px solid var(--ligne); margin: 14px 0; }
.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.md td, .md th { border: 1px solid var(--ligne); padding: 3px 8px; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.puce { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--ligne); cursor: pointer; background: var(--fond); }
.puce:hover { border-color: var(--doux); }
.indice { background: var(--dispo-fond); border-radius: 8px; padding: 8px 11px; margin: 6px 0; }
.message { white-space: pre-wrap; font-size: 13px; background: var(--fond); border-radius: 8px; padding: 8px 11px; border: 1px solid var(--ligne); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.actions a.bouton { text-decoration: none; }
.retour { margin-bottom: 10px; }
.commande { font: 12.5px "SF Mono", Menlo, monospace; background: var(--code-fond); padding: 2px 7px; border-radius: 5px; }
.zoom { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--ligne); background: var(--panneau); color: var(--texte); font-size: 17px; cursor: pointer; }
.legende { position: absolute; left: 14px; bottom: 14px; background: var(--panneau); border: 1px solid var(--ligne);
  border-radius: 10px; padding: 8px 12px; font-size: 12px; color: var(--doux); display: flex; gap: 12px; flex-wrap: wrap; max-width: 70%; }
/* noeuds */
.noeud rect { stroke-width: 1.5; }
.noeud text { font-size: 12.5px; fill: var(--texte); pointer-events: none; }
.noeud .petit { font-size: 10.5px; fill: var(--doux); }
.noeud { cursor: pointer; }
.n-pur rect { fill: var(--pur-fond); stroke: var(--pur); }
.n-reussi rect { fill: var(--ok-fond); stroke: var(--ok); }
.n-dispo rect { fill: var(--dispo-fond); stroke: var(--dispo); stroke-width: 2.5; }
.n-verrou rect { fill: var(--verrou-fond); stroke: var(--verrou); }
.n-verrou text { fill: var(--doux); }
.n-erreur rect, .n-modifie rect { fill: var(--err-fond); stroke: var(--err); stroke-width: 2.5; }
.n-cours rect { fill: var(--cours-fond); stroke: var(--cours); stroke-dasharray: 4 3; }
.n-boss rect { stroke-width: 3; }
.noeud.choisi rect { stroke: var(--accent); stroke-width: 3.5; }
.noeud.estompe { opacity: .18; }
.arete { fill: none; stroke: var(--arete); stroke-width: 1.4; }
.arete.loin { stroke-dasharray: 3 4; opacity: .6; }
.arete.vive { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
.arete.estompe { opacity: .06; }
.voie-titre { font-size: 15px; font-weight: 700; fill: var(--doux); }
@keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .9 } }
.halo { fill: none; stroke: var(--dispo); stroke-width: 6; opacity: .4; animation: pulse 2.4s ease-in-out infinite; }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
  #carte { height: 55vh; }
  #cote { border-left: none; border-top: 1px solid var(--ligne); padding: 16px; }
  .legende { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="carte">
    <svg id="svg"><g id="monde"></g></svg>
    <div class="legende">
      <span>⭐ pur</span><span>✅ réussi</span><span>🎯 disponible</span><span>🔒 verrouillé</span>
      <span>📖 cours</span><span>🌉 pont</span><span>💀 boss</span><span>♾️ ouvert</span><span>🏆 célèbre</span><span>❗ erreur</span>
    </div>
    <div class="zoom">
      <button id="zplus" title="Zoomer">+</button>
      <button id="zmoins" title="Dézoomer">−</button>
      <button id="zcentre" title="Recentrer sur ce qui est disponible">◎</button>
    </div>
  </div>
  <aside id="cote"></aside>
</div>
<script>
const DONNEES = /*__DONNEES__*/null;

// ---------- modèle ----------
const exos = DONNEES ? DONNEES.exercices : [];
const branches = DONNEES ? DONNEES.branches : [];
const parId = new Map(exos.map(e => [e.id, e]));
const enfants = new Map(exos.map(e => [e.id, []]));
for (const e of exos) for (const d of e.deps) if (enfants.has(d)) enfants.get(d).push(e.id);

const memoFini = new Map();
function fini(id) {
  if (memoFini.has(id)) return memoFini.get(id);
  const e = parId.get(id);
  let r = true;
  if (e) r = e.genre === "cours" ? e.deps.every(fini) : (e.statut === "pur" || e.statut === "reussi");
  memoFini.set(id, r);
  return r;
}
function dispo(e) { return !fini(e.id) && e.deps.every(fini); }
function etat(e) {
  if (e.genre === "cours") return fini(e.id) ? "cours" : "verrou";
  if (e.statut === "pur") return "pur";
  if (e.statut === "reussi") return "reussi";
  if (e.statut === "erreur") return "erreur";
  if (e.statut === "modifie") return "modifie";
  return dispo(e) ? "dispo" : "verrou";
}
const ICONES = { pur: "⭐", reussi: "✅", dispo: "🎯", verrou: "🔒", erreur: "❗", modifie: "⚠️", cours: "📖" };
const LIBELLES = { pur: "Réussi · pur ⭐", reussi: "Réussi ✅", dispo: "Disponible", verrou: "Verrouillé",
  erreur: "Ne compile pas", modifie: "Énoncé modifié", cours: "Cours" };
function decor(e) { return { boss: "💀 ", ouvert: "♾️ ", pont: "🌉 ", cours: "" }[e.genre] || ""; }
function etoiles(n) { return "★".repeat(n) + "☆".repeat(5 - n); }

const memoProf = new Map();
function prof(id, pile = new Set()) {
  if (memoProf.has(id)) return memoProf.get(id);
  if (pile.has(id)) return 0;
  pile.add(id);
  const e = parId.get(id);
  let p = 0;
  if (e) for (const d of e.deps) if (parId.has(d)) p = Math.max(p, prof(d, pile) + 1);
  memoProf.set(id, p);
  return p;
}

// ---------- mise en page ----------
const L = 190, H = 50, COL = 230, LIGNE = 64, MARGE_G = 40, ENTETE = 34, ESPACE = 26;
const pos = new Map();
let largeur = 0, hauteur = 0;
const voies = [];
(function placer() {
  let y = 20;
  for (const b of branches) {
    const membres = exos.filter(e => e.branche === b.id);
    if (!membres.length) continue;
    const colonnes = new Map();
    for (const e of membres) {
      const p = prof(e.id);
      if (!colonnes.has(p)) colonnes.set(p, []);
      colonnes.get(p).push(e);
    }
    let maxPile = 1;
    for (const [p, es] of colonnes) {
      es.sort((a, b) => a.difficulte - b.difficulte || a.titre.localeCompare(b.titre));
      maxPile = Math.max(maxPile, es.length);
    }
    const haut = ENTETE + maxPile * LIGNE + 10;
    for (const [p, es] of colonnes) {
      const decal = (maxPile - es.length) * LIGNE / 2;
      es.forEach((e, i) => {
        const x = MARGE_G + p * COL, yy = y + ENTETE + decal + i * LIGNE;
        pos.set(e.id, { x, y: yy });
        largeur = Math.max(largeur, x + L + 60);
      });
    }
    voies.push({ b, y, haut });
    y += haut + ESPACE;
  }
  hauteur = y;
})();

// ---------- dessin ----------
const NS = "http://www.w3.org/2000/svg";
const monde = document.getElementById("monde");
function el(nom, attrs, parent) {
  const n = document.createElementNS(NS, nom);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
const gVoies = el("g", {}, monde), gAretes = el("g", {}, monde), gNoeuds = el("g", {}, monde);
voies.forEach((v, i) => {
  el("rect", { x: -2000, y: v.y - 6, width: largeur + 4000, height: v.haut, fill: i % 2 ? "transparent" : "var(--bande)" }, gVoies);
  const t = el("text", { x: MARGE_G, y: v.y + 18, class: "voie-titre" }, gVoies);
  t.textContent = `${v.b.emoji} ${v.b.titre}`;
});
const aretes = [];
for (const e of exos) for (const d of e.deps) {
  const a = pos.get(d), b = pos.get(e.id);
  if (!a || !b) continue;
  const x1 = a.x + L, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
  const dx = Math.max(40, (x2 - x1) / 2);
  const chemin = el("path", { d: `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`,
    class: "arete" + (parId.get(d).branche !== e.branche ? " loin" : "") }, gAretes);
  aretes.push({ de: d, vers: e.id, el: chemin });
}
const noeuds = new Map();
function couper(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }
for (const e of exos) {
  const p = pos.get(e.id);
  const st = etat(e);
  const g = el("g", { class: `noeud n-${st}` + (e.genre === "boss" || e.genre === "ouvert" ? " n-boss" : ""),
    transform: `translate(${p.x},${p.y})` }, gNoeuds);
  if (st === "dispo") el("rect", { x: -4, y: -4, width: L + 8, height: H + 8, rx: 13, class: "halo" }, g);
  el("rect", { width: L, height: H, rx: 10 }, g);
  const t1 = el("text", { x: 10, y: 21 }, g);
  t1.textContent = `${ICONES[st]} ${decor(e)}${couper(e.titre, 22)}`;
  if (e.celebre) { const tr = el("text", { x: L - 20, y: 39, class: "petit" }, g); tr.textContent = "🏆"; }
  const t2 = el("text", { x: 10, y: 39, class: "petit" }, g);
  t2.textContent = e.genre === "cours" ? "cours" : etoiles(e.difficulte);
  const titre = el("title", {}, g); titre.textContent = `${e.titre}\n${e.id}`;
  g.addEventListener("click", ev => { ev.stopPropagation(); choisir(e.id, false); });
  noeuds.set(e.id, g);
}

// ---------- déplacement / zoom ----------
const carte = document.getElementById("carte");
let vue = { x: 0, y: 0, k: 1 };
function appliquer() { monde.setAttribute("transform", `translate(${vue.x},${vue.y}) scale(${vue.k})`); }
function zoomer(facteur, cx, cy) {
  const k = Math.min(2.5, Math.max(0.15, vue.k * facteur));
  const f = k / vue.k;
  vue.x = cx - (cx - vue.x) * f; vue.y = cy - (cy - vue.y) * f; vue.k = k; appliquer();
}
carte.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = carte.getBoundingClientRect();
  if (ev.ctrlKey || ev.metaKey) zoomer(Math.exp(-ev.deltaY * 0.01), ev.clientX - r.left, ev.clientY - r.top);
  else { vue.x -= ev.deltaX; vue.y -= ev.deltaY; appliquer(); }
}, { passive: false });
let glisse = null;
carte.addEventListener("pointerdown", ev => {
  if (ev.target.closest(".zoom") || ev.target.closest(".noeud")) return;
  glisse = { x: ev.clientX, y: ev.clientY, vx: vue.x, vy: vue.y, bouge: false };
  carte.classList.add("glisse");
});
window.addEventListener("pointermove", ev => {
  if (!glisse) return;
  const dx = ev.clientX - glisse.x, dy = ev.clientY - glisse.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) glisse.bouge = true;
  vue.x = glisse.vx + dx; vue.y = glisse.vy + dy; appliquer();
});
window.addEventListener("pointerup", () => {
  if (glisse && !glisse.bouge) { choisi = null; surligner(); afficherAccueil(); }
  glisse = null; carte.classList.remove("glisse");
});
document.getElementById("zplus").onclick = () => { const r = carte.getBoundingClientRect(); zoomer(1.25, r.width / 2, r.height / 2); };
document.getElementById("zmoins").onclick = () => { const r = carte.getBoundingClientRect(); zoomer(0.8, r.width / 2, r.height / 2); };
document.getElementById("zcentre").onclick = () => centrerSurDispo();
function centrerSur(id, k) {
  const p = pos.get(id); if (!p) return;
  const r = carte.getBoundingClientRect();
  vue.k = k || Math.max(vue.k, 0.8);
  vue.x = r.width / 2 - (p.x + L / 2) * vue.k; vue.y = r.height / 2 - (p.y + H / 2) * vue.k; appliquer();
}
function centrerSurDispo() {
  const d = exos.filter(e => e.genre !== "cours" && dispo(e)).sort((a, b) => prof(a.id) - prof(b.id));
  const r = carte.getBoundingClientRect();
  if (d.length) {
    vue.k = 0.9;
    const p = pos.get(d[0].id);
    vue.x = Math.min(r.width * 0.3, 280) - p.x * vue.k; vue.y = r.height * 0.4 - (p.y + H / 2) * vue.k; appliquer();
  } else { vue = { x: 20, y: 20, k: Math.min(1, r.height / (hauteur + 40)) }; appliquer(); }
}

// ---------- sélection ----------
let choisi = null, filtre = "tout", recherche = "";
function voisins(id) {
  const s = new Set([id]);
  const monter = x => { for (const d of (parId.get(x)?.deps || [])) if (!s.has(d)) { s.add(d); monter(d); } };
  const descendre = x => { for (const c of (enfants.get(x) || [])) if (!s.has(c)) { s.add(c); descendre(c); } };
  monter(id); descendre(id);
  return s;
}
function correspond(e) {
  if (recherche) {
    const q = recherche.toLowerCase();
    if (!(e.titre.toLowerCase().includes(q) || e.id.toLowerCase().includes(q))) return false;
  }
  const st = etat(e);
  if (filtre === "dispo") return st === "dispo";
  if (filtre === "faits") return st === "pur" || st === "reussi";
  if (filtre === "boss") return e.genre === "boss" || e.genre === "ouvert";
  return true;
}
function surligner() {
  const v = choisi ? voisins(choisi) : null;
  for (const [id, g] of noeuds) {
    const e = parId.get(id);
    g.classList.toggle("choisi", id === choisi);
    g.classList.toggle("estompe", (v && !v.has(id)) || (!v && !correspond(e)));
  }
  for (const a of aretes) {
    const vive = choisi && (a.vers === choisi || a.de === choisi);
    a.el.classList.toggle("vive", !!vive);
    a.el.classList.toggle("estompe", !!(v && !(v.has(a.de) && v.has(a.vers))));
  }
}
function choisir(id, centrer = true) {
  choisi = id; surligner(); afficherExo(parId.get(id));
  if (centrer) centrerSur(id);
}

// ---------- markdown minimal ----------
function echap(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function enLigne(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = echap(s)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${echap(codes[+i])}</code>`);
}
function markdown(src) {
  const lignes = src.split("\n");
  let html = "", i = 0;
  while (i < lignes.length) {
    const l = lignes[i];
    if (/^```/.test(l)) {
      const bloc = []; i++;
      while (i < lignes.length && !/^```/.test(lignes[i])) bloc.push(lignes[i++]);
      i++; html += `<pre><code>${echap(bloc.join("\n"))}</code></pre>`; continue;
    }
    let m;
    if ((m = /^(#{1,4})\s+(.*)$/.exec(l))) { const n = m[1].length; html += `<h${n}>${enLigne(m[2])}</h${n}>`; i++; continue; }
    if (/^---+\s*$/.test(l)) { html += "<hr>"; i++; continue; }
    if (/^\s*\|/.test(l)) {
      const rangs = [];
      while (i < lignes.length && /^\s*\|/.test(lignes[i])) rangs.push(lignes[i++]);
      html += "<table>" + rangs.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r)).map((r, k) =>
        "<tr>" + r.trim().replace(/^\||\|$/g, "").split("|").map(c => k === 0 ? `<th>${enLigne(c.trim())}</th>` : `<td>${enLigne(c.trim())}</td>`).join("") + "</tr>").join("") + "</table>";
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordonnee = /^\s*\d+\./.test(l);
      const items = [];
      while (i < lignes.length && (/^\s*([-*]|\d+\.)\s+/.test(lignes[i]) || (/^\s{2,}\S/.test(lignes[i]) && items.length))) {
        if (/^\s*([-*]|\d+\.)\s+/.test(lignes[i])) items.push(lignes[i].replace(/^\s*([-*]|\d+\.)\s+/, ""));
        else items[items.length - 1] += " " + lignes[i].trim();
        i++;
      }
      const t = ordonnee ? "ol" : "ul";
      html += `<${t}>` + items.map(x => `<li>${enLigne(x)}</li>`).join("") + `</${t}>`; continue;
    }
    if (!l.trim()) { i++; continue; }
    const para = [];
    while (i < lignes.length && lignes[i].trim() && !/^(#{1,4}\s|```|\s*([-*]|\d+\.)\s|---+\s*$|\s*\|)/.test(lignes[i])) para.push(lignes[i++]);
    html += `<p>${enLigne(para.join(" "))}</p>`;
  }
  return html;
}

// ---------- panneau latéral ----------
const cote = document.getElementById("cote");
function lireLocal(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (_) { return def; } }
function ecrireLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }

function ligneListe(e) {
  const st = etat(e);
  return `<li data-id="${e.id}">${ICONES[st]} <span>${echap(decor(e) + e.titre)}</span><span class="id">${etoiles(e.difficulte)}</span></li>`;
}
function brancher(racine) {
  racine.querySelectorAll("[data-id]").forEach(n => n.addEventListener("click", () => choisir(n.dataset.id)));
}
function afficherAccueil() {
  const vrais = exos.filter(e => e.genre !== "cours");
  const purs = vrais.filter(e => e.statut === "pur").length;
  const reussis = vrais.filter(e => e.statut === "reussi").length;
  const n = vrais.length || 1;
  const disponibles = exos.filter(e => e.genre !== "cours" && dispo(e))
    .sort((a, b) => prof(a.id) - prof(b.id) || a.difficulte - b.difficulte);
  const listeFiltree = exos.filter(e => e.genre !== "cours" && correspond(e));
  let parBranche = "";
  for (const b of branches) {
    const es = vrais.filter(e => e.branche === b.id);
    if (!es.length) continue;
    const f = es.filter(e => fini(e.id)).length;
    parBranche += `<li data-branche="${b.id}">${b.emoji} <span>${echap(b.titre)}</span><span class="id">${f}/${es.length}</span></li>`;
  }
  cote.innerHTML = `
    <h1>Parcours Lean</h1>
    <div class="sous">${purs + reussis} / ${vrais.length} exercices réussis · ${purs} ⭐</div>
    <div class="barre"><i style="width:${100 * purs / n}%;background:var(--pur)"></i><i style="width:${100 * reussis / n}%;background:var(--ok)"></i></div>
    <div class="sous">Clique sur un exercice pour voir son énoncé. Glisse pour te déplacer, ⌘/Ctrl + molette pour zoomer.</div>
    <div class="filtres">
      ${[["tout", "Tout"], ["dispo", "Disponibles"], ["faits", "Réussis"], ["boss", "Boss & ouverts"]]
        .map(([k, t]) => `<button data-filtre="${k}" class="${filtre === k ? "actif" : ""}">${t}</button>`).join("")}
    </div>
    <input type="search" id="recherche" placeholder="Chercher un exercice…" value="${echap(recherche)}">
    ${filtre === "tout" && !recherche ? `
      <h2>À faire maintenant (${disponibles.length})</h2>
      <ul class="liste">${disponibles.slice(0, 30).map(ligneListe).join("") || "<li>Rien de disponible : lance <span class='commande'>./parcours verifier</span></li>"}</ul>
      <h2>Branches</h2><ul class="liste">${parBranche}</ul>` : `
      <h2>${listeFiltree.length} exercice(s)</h2>
      <ul class="liste">${listeFiltree.map(ligneListe).join("")}</ul>`}
    <h2>Mettre à jour</h2>
    <p class="sous">Cette page est régénérée par <span class="commande">./parcours verifier</span>. Recharge-la ensuite.</p>`;
  brancher(cote);
  cote.querySelectorAll("[data-filtre]").forEach(b => b.onclick = () => { filtre = b.dataset.filtre; surligner(); afficherAccueil(); });
  cote.querySelectorAll("[data-branche]").forEach(b => b.onclick = () => {
    const premier = exos.filter(e => e.branche === b.dataset.branche).sort((x, y) => prof(x.id) - prof(y.id))[0];
    if (premier) centrerSur(premier.id, 0.8);
  });
  const champ = document.getElementById("recherche");
  champ.oninput = () => { recherche = champ.value; surligner(); afficherAccueil(); const c = document.getElementById("recherche"); c.focus(); c.setSelectionRange(c.value.length, c.value.length); };
}
function afficherExo(e) {
  const st = etat(e);
  const b = branches.find(x => x.id === e.branche);
  const revelesLocal = lireLocal("indices:" + e.id, 0);
  const nbRev = Math.max(e.reveles || 0, revelesLocal);
  const deps = e.deps.map(d => parId.get(d)).filter(Boolean);
  const suiv = (enfants.get(e.id) || []).map(d => parId.get(d));
  const manquants = deps.filter(d => !fini(d.id));
  cote.innerHTML = `
    <button class="bouton retour" id="retour">← Retour</button>
    <div class="sous">${b ? b.emoji + " " + echap(b.titre) : ""} · <span class="commande">${e.id}</span></div>
    <h1 style="margin-top:6px">${echap(decor(e) + e.titre)}</h1>
    <div><span class="badge b-${st === "dispo" ? "dispo" : st}">${ICONES[st]} ${LIBELLES[st]}</span>
      ${e.genre !== "cours" ? `<span class="etoiles" style="margin-left:8px">${etoiles(e.difficulte)}</span>` : ""}
      ${e.genre === "boss" ? `<span class="badge b-erreur" style="margin-left:6px">💀 boss</span>` : ""}
      ${e.genre === "ouvert" ? `<span class="badge b-cours" style="margin-left:6px">♾️ problème ouvert</span>` : ""}
      ${e.genre === "pont" ? `<span class="badge b-reussi" style="margin-left:6px">🌉 pont</span>` : ""}
      ${e.celebre ? `<span class="badge b-pur" style="margin-left:6px" title="Liste des 100 théorèmes célèbres de Freek Wiedijk">🏆 n°${e.celebre} des 100 théorèmes</span>` : ""}</div>
    <div class="actions">
      <a class="bouton" href="${e.lien}">Ouvrir dans VS Code</a>
      <button class="bouton" id="copier">Copier le chemin</button>
    </div>
    ${manquants.length ? `<p class="sous">🔒 Il faut d'abord réussir : ${manquants.map(d => `<span class="puce" data-id="${d.id}">${echap(d.titre)}</span>`).join(" ")}</p>` : ""}
    ${e.message ? `<div class="message">${echap(e.message)}</div>` : ""}
    ${e.debloque.length ? `<p>🔑 <strong>Débloque</strong> : ${e.debloque.map(echap).join(", ")} pour les exercices qui en dépendent.</p>` : ""}
    <div class="md">${markdown(e.enonce)}</div>
    ${deps.length ? `<h2>Dépend de</h2><div class="puces">${deps.map(d => `<span class="puce" data-id="${d.id}">${ICONES[etat(d)]} ${echap(d.titre)}</span>`).join("")}</div>` : ""}
    ${suiv.length ? `<h2>Ouvre la voie vers</h2><div class="puces">${suiv.map(d => `<span class="puce" data-id="${d.id}">${ICONES[etat(d)]} ${echap(d.titre)}</span>`).join("")}</div>` : ""}
    ${e.indices.length ? `<h2>Indices (${Math.min(nbRev, e.indices.length)}/${e.indices.length})</h2>
      <div id="indices">${e.indices.slice(0, nbRev).map((t, i) => `<div class="indice"><strong>${i + 1}.</strong> ${enLigne(t)}</div>`).join("")}</div>
      ${nbRev < e.indices.length ? `<button class="bouton" id="indice">💡 Révéler l'indice ${nbRev + 1}</button>` : ""}` : ""}
    ${e.genre !== "cours" ? `<h2>Solution</h2>
      ${e.solution ? `<button class="bouton" id="solution">👀 Voir la solution…</button><div id="sol"></div>`
        : `<p class="sous">${e.genre === "ouvert" ? "Personne au monde ne connaît la solution." : "Pas de solution de référence : à toi de jouer."}</p>`}` : ""}
  `;
  brancher(cote);
  document.getElementById("retour").onclick = () => { choisi = null; surligner(); afficherAccueil(); };
  document.getElementById("copier").onclick = () => { try { navigator.clipboard.writeText(e.fichier); } catch (_) {} };
  const bi = document.getElementById("indice");
  if (bi) bi.onclick = () => { ecrireLocal("indices:" + e.id, nbRev + 1); afficherExo(e); };
  const bs = document.getElementById("solution");
  if (bs) bs.onclick = () => {
    if (!confirm("Afficher la solution de « " + e.titre + " » ? Essaie encore un peu, ou prends un indice !")) return;
    const texte = e.solution.replace(/^\/- @parcours[\s\S]*?-\/\s*/, "");
    document.getElementById("sol").innerHTML = `<pre class="code">${echap(texte)}</pre>`;
    bs.remove();
  };
}

if (!DONNEES) {
  cote.innerHTML = "<h1>Parcours Lean</h1><p>Cette page est un modèle : lance <span class='commande'>./parcours verifier</span> pour générer <span class='commande'>progression.html</span>.</p>";
} else {
  afficherAccueil();
  surligner();
  requestAnimationFrame(centrerSurDispo);
}
</script>
</body>
</html>
